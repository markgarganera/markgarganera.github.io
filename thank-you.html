<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mark Garganera</title>

    <link rel="icon" href="imgs/favicon.ico">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="imgs/favicon.ico" type="image/x-icon">

    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: inherit;
        }

        .thank-you-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .thank-you-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .thank-you-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #fff;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255,255,255,.75);
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 50px;
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
        }

        .btn-home:hover {
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37,99,235,.35);
        }

        .signature {
            margin-top: 35px;
            color: rgba(255,255,255,.6);
            font-size: 1rem;
        }

        .signature strong {
            display: block;
            font-size: 1.35rem;
            color: #fff;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<section class="thank-you-section">

    <div class="thank-you-card">

        <div class="thank-you-icon">
            ✓
        </div>

        <h1>Thank You!</h1>

        <p>
            Your message has been successfully sent.
            I appreciate you taking the time to get in touch and will review your enquiry as soon as possible.
            You can typically expect a response within 1–2 business days.
        </p>

        <a href="index.html" class="btn-home">
            ← Back to Portfolio
        </a>

        <div class="signature">
            Kind regards,
            <strong>Mark Garganera</strong>
            Website Developer & Designer
        </div>

    </div>

</section>

</body>
</html>
